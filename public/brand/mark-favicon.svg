<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="currentColor" role="img" aria-labelledby="hr-mark-favicon-title">
  <title id="hr-mark-favicon-title">Health Root</title>
  <!--
    Small-size variant of the Health Root mark, tuned for 16-32px rendering.

    Two deliberate departures from mark.svg, per standard practice for optical
    small-size artwork (the same reason Spotify and Airbnb ship simplified
    small-size marks):

      1. Full-bleed disc (r 32). At 16px a 2u margin costs half a pixel of
         coverage for nothing; the tab bar wants every pixel it can get.
      2. Bolder figure. Crown grown to r 6.2 and lifted, shoulder mass widened,
         root tips pulled inboard and dropped, fork opened from 23.6u to
         25.6u. Every gap is now at least 3.9u, which survives downsampling
         instead of closing up into a blob.

    Ring weight 6.9u at the root tips, 11.3u at the crown.
  -->
  <path fill-rule="evenodd" d="
    M 0 32
    A 32 32 0 1 1 64 32
    A 32 32 0 1 1 0 32
    Z

    M 25.8 17.5
    A 6.2 6.2 0 1 1 38.2 17.5
    A 6.2 6.2 0 1 1 25.8 17.5
    Z

    M 23.6 31.2
    C 24.0 28.8 26.6 27.6 32 27.6
    C 37.4 27.6 40.0 28.8 40.4 31.2
    C 41.6 33.8 42.2 36.2 42.2 38.4
    C 44.2 43.0 45.6 47.6 44.8 53.6
    C 43.0 49.6 38.2 45.0 32 41.6
    C 25.8 45.0 21.0 49.6 19.2 53.6
    C 18.4 47.6 19.8 43.0 21.8 38.4
    C 21.8 36.2 22.4 33.8 23.6 31.2
    Z
  "/>
</svg>
